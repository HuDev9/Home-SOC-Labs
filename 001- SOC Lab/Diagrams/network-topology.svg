<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Home SOC lab network topology</title>
<desc>Three VirtualBox VMs on one bridged LAN segment (192.168.1.0/24): Kali Linux attacker, Windows 11 victim running Sysmon and Splunk Universal Forwarder, and an Ubuntu Server running Splunk Enterprise as the SIEM. Windows forwards logs to the SIEM over TCP 9997; Kali sends attack traffic to Windows.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="430" fill="#15161a"/>

<g>
<rect x="260" y="20" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Home router</text>
<text x="340" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">192.168.1.0/24</text>
</g>

<path d="M340,76 L135,130" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" marker-end="url(#arrow)"/>
<path d="M340,76 L340,130" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" marker-end="url(#arrow)"/>
<path d="M340,76 L545,130" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="130" width="190" height="170" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="135" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Ubuntu 24.04</text>
<text x="135" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">SIEM host</text>
<text x="56" y="220" font-family="sans-serif" font-size="12" fill="#085041">192.168.1.125</text>
<text x="56" y="238" font-family="sans-serif" font-size="12" fill="#085041">Splunk Enterprise</text>
<text x="56" y="256" font-family="sans-serif" font-size="12" fill="#085041">TCP 9997 receiving</text>
</g>

<g>
<rect x="245" y="130" width="190" height="170" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Windows 11 Home</text>
<text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">Victim</text>
<text x="261" y="220" font-family="sans-serif" font-size="12" fill="#633806">192.168.1.188</text>
<text x="261" y="238" font-family="sans-serif" font-size="12" fill="#633806">Sysmon</text>
<text x="261" y="256" font-family="sans-serif" font-size="12" fill="#633806">Splunk Univ Forwarder</text>
</g>

<g>
<rect x="450" y="130" width="190" height="170" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="545" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Kali Linux</text>
<text x="545" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Attacker</text>
<text x="466" y="220" font-family="sans-serif" font-size="12" fill="#712B13">192.168.1.122</text>
<text x="466" y="238" font-family="sans-serif" font-size="12" fill="#712B13">nmap, Hydra</text>
<text x="466" y="256" font-family="sans-serif" font-size="12" fill="#712B13">msfvenom, Metasploit</text>
</g>

<path d="M320,300 L320,325 L150,325 L150,300" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">Logs forwarded (TCP 9997)</text>

<path d="M470,300 L470,358 L360,358 L360,300" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="415" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">Attack traffic (Kali to Windows)</text>

<line x1="60" y1="400" x2="90" y2="400" stroke="#1D9E75" stroke-width="1.5"/>
<text x="98" y="404" font-family="sans-serif" font-size="12" fill="#B4B2A9">Log forwarding</text>
<line x1="280" y1="400" x2="310" y2="400" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="318" y="404" font-family="sans-serif" font-size="12" fill="#B4B2A9">Attack traffic</text>
</svg>
