# Splunk Universal Forwarder — inputs.conf
# Host: Windows 11 Home (Victim) — 192.168.x.xxx
# Purpose: define which Windows Event Log channels the forwarder collects
#          and ships to the Splunk Enterprise indexer at 192.168.x.xxx:xxx
#
# Location on host: %SPLUNK_UF_HOME%\etc\system\local\inputs.conf

[WinEventLog://Application]
disabled = 0
renderXml = true
index = main

[WinEventLog://Security]
disabled = 0
renderXml = true
index = main

[WinEventLog://System]
disabled = 0
renderXml = true
index = main

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = true
index = main

# Notes
# -----
# - Every stanza explicitly targets index=main. This was not the default —
#   see troubleshooting/issue-01-index-mismatch.md for what happens when
#   an input doesn't specify an index that actually exists on the indexer.
# - renderXml = true preserves the full structured XML event data rather
#   than the flattened plaintext rendering, which matters for parsing
#   fields like CommandLine and ParentImage out of Sysmon events reliably.
